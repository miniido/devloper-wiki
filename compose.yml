services:
  postgres:
    image: postgres:17
    container_name: dev-wiki-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: devwiki
      POSTGRES_USER: devwiki
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - devwiki_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devwiki -d devwiki"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  devwiki_pgdata:
